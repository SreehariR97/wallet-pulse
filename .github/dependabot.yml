version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Patch and minor bumps land as one weekly PR; majors stay separate
      # so each framework migration (Next, React, Tailwind, Zod...) gets
      # its own review.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tracks the Node 22.x runtime pinned in `engines` (Vercel).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 is a migration (see FOLLOWUPS.md), not a bump.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      # Must match the Next.js major; upgrade together with `next`.
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
