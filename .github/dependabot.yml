version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Patch and minor bumps land as one weekly PR; majors stay separate
      # so each framework migration (Next, React, Tailwind, Zod...) gets
      # its own review.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tracks the Node 22.x runtime pinned in `engines` (Vercel).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 is a migration (see FOLLOWUPS.md), not a bump.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      # Must match the Next.js major; upgrade together with `next`.
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      # Next 15+/16 is a migration (React 19, async request APIs, ESLint
      # flat config, middleware -> proxy); see FOLLOWUPS.md.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # v3 supports Tailwind 4 only; upgrade with the Tailwind 4 migration.
      - dependency-name: tailwind-merge
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
